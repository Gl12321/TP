name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_ai:
        description: Build and verify the complete Qwen3.5 4B application
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-bootstrap.txt
            backend/requirements.txt
            packages/sql_agent/pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check backend packages/sql_agent/src runtime tests tools run.py
      - run: python -m ruff format --check backend packages/sql_agent runtime tests tools run.py
      - run: python -m pytest backend/tests packages/sql_agent/tests tests -q
      - run: python -m build packages/sql_agent --wheel

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest backend/tests/test_postgres_integration.py -q
        env:
          RAZBOR_TEST_DATABASE_URL: postgresql://integration:isolated-ci-password@127.0.0.1:5432/integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py --without-ai
      - run: python tools/smoke.py
      - if: always()
        run: python run.py --stop

  real-ai:
    if: (github.event_name == 'workflow_dispatch' && inputs.real_ai) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-ai]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: models
          key: qwen35-4b-${{ runner.os }}-${{ hashFiles('config.yaml') }}
      - run: |
          python -c "from pathlib import Path; p=Path('config.yaml'); p.write_text(p.read_text().replace('source_hosts: []', 'source_hosts: [db]'))"
      - run: python run.py --model qwen3.5-4b
      - run: python tools/acceptance.py
      - if: failure()
        run: |
          docker ps -a
          docker ps -aq | xargs -r -I '{}' docker logs --tail 150 '{}'
      - if: always()
        run: python run.py --stop
