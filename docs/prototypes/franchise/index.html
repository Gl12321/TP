}.question{margin-top:20px;padding:20px 21px}.question h3{margin-bottom:6px}.question p{font-size:12px;color:var(--muted)}.askline{display:flex;gap:9px;margin-top:13px}.askline input{flex:1;min-width:0;font-size:13px}.askline button{font-size:12px;white-space:nowrap}.error{background:#fff3ef;border:1px solid #efd6c8;color:#9a5235;border-radius:7px;padding:11px 13px;margin-top:13px;font-size:12px}.prepared{margin-top:15px;border-top:1px solid var(--line);padding-top:15px}.prepared .pill{margin-bottom:8px}.prepared p{margin-bottom:10px}.code{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:11px;line-height:1.6;padding:13px;background:#f3f6fa;border:1px solid var(--line);border-radius:6px}details{font-size:12px}summary{cursor:pointer;font-weight:600;color:#526a86;padding:9px 0}.twocol{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:19px;align-items:start}.section{padding:21px}.section+.section{border-top:1px solid var(--line)}.detailfacts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:19px 0}.detailfacts .fact span{display:block;font-size:11px;color:var(--muted)}.detailfacts .fact strong{display:block;font-size:22px;margin-top:5px;letter-spacing:-.5px}.keyvalues{display:grid;grid-template-columns:100px 1fr;gap:9px 10px;font-size:12px}.keyvalues dt{color:var(--muted)}.keyvalues dd{margin:0}.thread{display:grid;gap:13px;margin:18px 0}.message{padding:14px 16px;background:#f4f7fc;border:1px solid #e0e7f0;border-radius:9px}.message.manager{background:#f0f7f1;border-color:#dce9de}.message .who{font-size:11px;font-weight:650;color:#4d6783}.message.manager .who{color:#437453}.message p{margin-top:7px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.message .meta{margin-top:8px;font-size:10px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:12px}.empty{padding:38px 22px;text-align:center}.empty p{max-width:500px;margin:10px auto;color:var(--muted);font-size:13p <body>
<div class="demo">Демонстрация · вымышленные данные · без подключения к БД и AI · роли имитируются · изменения до перезагрузки</div>
<div class="shell">
<aside class="sidebar"><div class="brand"><span class="mark">TP</span><span>Сеть / аналитика</span></div><div><p class="eyebrow">Рабочее пространство</p><nav class="nav" aria-label="Разделы"><button data-nav="overview" class="active"><span class="icon" aria-hidden="true">◫</span>Обзор сети</button><button data-nav="points"><span class="icon" aria-hidden="true">▦</span>Точки</button><button data-nav="analyses"><span class="icon" aria-hidden="true">▤</span>Разборы<span class="count" id="analysisCount">0</span></button><button data-nav="data" id="dataNav"><span class="icon" aria-hidden="true">◉</span>Данные</button></nav></div><section class="access"><p class="eyebrow" style="margin:0">Ваша область</p><strong id="scopeName"></strong><p id="scopeDescription"></p></section><div class="sidebarfooter">Макет продукта<br>Один вопрос → готовая таблица<br><a href="../../research/franchise/README.md">Описание концепции ↗</a></div></aside>
<div class="workspace"><header class="topbar"><div class="crumb" id="crumb">Аналитика сети / Обзор</div><div class="rolebox"><label for="role">Роль · только симуляция</label><select id="role"><option value="director">Руководитель сети</option><option value="analyst">Аналитик сети</option><option value="regional">Региональный менеджер · Москва</option><option value="franchisee">Франчайзи · Альфа</option><option value="manager">Управляющий точки · М1</option></select></div></header><main id="main"></main></div>
</div>
<dialog class="drawer" id="pointDialog" aria-labelledby="pointTitle"><div id="pointContent"></div></dialog>
<div class="sr" aria-live="polite" id="live"></div>
<script>
const points=[{id:"М1",city:"Москва",name:"Арбат",entity:"Альфа",base:1200000,current:960000,plan:1100000},{id:"М2",city:"Москва",name:"Сокол",entity:"Альфа",base:800000,current:840000,plan:850000},{id:"П1",city:"Петербург",name:"Центр",entity:"Бета",base:1000000,current:1080000,plan:1050000},{id:"К1",city:"Казань",name:"Центр",entity:"Гамма",base:600000,current:600000,plan:650000},{id:"К2",city:"Казань",name:"Парк",entity:"Гамма",base:null,current:400000,plan:350000},{id:"П2",city:"Петербург",name:"Порт",entity:"Бета",base:700000,current:null,plan:750000}];
const roles={director:{name:"Руководитель сети",scope:"Вся доступная сеть",description:"Все точки и разборы сети",create:true},analyst:{name:"Аналитик сети",scope:"Вся доступная сеть",description:"Все точки, разборы и состояние источников",create:true,data:true},regional:{name:"Региональный менеджер",scope:"Москва",description:"Точки и разборы своего региона",create:true},franchisee:{name:"Франчайзи «Альфа»",scope:"Партнёр «Альфа»",description:"Только свои точки и их разборы",create:true},manager:{name:"Управляющий М1",scope:"М1 · Арбат",description:"Одна точка и вопросы по её работе",create:false}};
const example="Какие точки снизили продажи в сентябре по сравнению с августом?",snapshot="DEMO-2026-10-02",labels={saved:"Сохранён",waiting:"Ждём управляющего",answered:"Ответ получен",done:"Итог зафиксирован"};
let role="director",nav="overview",city=null,analyses=[],selectedAnalysis=null,selectedPoint=null,question=example,queryReady=false,queryError="",notice="",nextId=1;
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v===null?"Нет данных":new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(v)+" ₽";
const number=v=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1}).format(v);
const percent=v=>v===null?"—":number(v)+"%";
const signed=v=>v===null?"—":(v>0?"+":v<0?"−":"")+money(Math.abs(v));
const change=p=>p.base===null||p.current===null?null:p.current-p.base;
const rate=p=>p.base===null||p.current===null||p.base===0?null:(p.current-p.base)/p.base*100;
const comparable=p=>p.base!==null&&p.current!==null;
const clone=v=>JSON.parse(JSON.stringify(v));
function allowed(){return points.filter(p=>role==="regional"?p.city==="Москва":role==="franchisee"?p.entity==="Альфа":role==="manager"?p.id==="М1":true);}
function visible(){return allowed().filter(p=>city===null||p.city===city);}
function accessibleAnalyses(){const ids=new Set(allowed().map(p=>p.id));return analyses.filter(a=>ids.has(a.point.id)&&(role!=="manager"||a.request!==null));}
function analysis(){return accessibleAnalyses().find(a=>a.id===selectedAnalysis)||null;}
function stats(list){const known=list.filter(p=>p.current!==null),pair=list.filter(comparable),current=known.reduce((s,p)=>s+p.current,0),plan=known.reduce((s,p)=>s+p.plan,0),base=pair.reduce((s,p)=>s+p.base,0),paired=pair.reduce((s,p)=>s+p.current,0);return{count:list.length,known:known.length,pairs:pair.length,fresh:list.filter(p=>p.base===null&&p.current!==null).length,missing:list.filter(p=>p.current===null).length,current,plan,base,paired,delta:paired-base,rate:pair.length&&base!==0?(paired-base)/base*100:null,planRate:known.length&&plan!==0?current/plan*100:null};}
function say(text){notice=text;$("live").textContent=text;}
function quality(p){return p.current===null?'<span class="pill bad">Нет данных за сентябрь</span>':p.base===null?'<span class="pill warn">Новая · без сравнения</span>':'<span class="pill ok">Оба периода полные</span>';}
function heading(title,description){return`<div class="heading"><div><p class="eyebrow" style="margin:0 0 8px">Продажи после возвратов · RUB</p><h1>${esc(title)}</h1><p>${esc(description)}</p></div><div class="period">Сентябрь 2026<span>Сравнение с августом 2026</span></div></div>`;}
function metrics(list){const s=stats(list);return`<div class="cards"><section class="card metric"><div class="label">Продажи · известные данные</div><div class="value">${s.known?money(s.current):"Нет данных"}</div><div class="foot">${s.known} из ${s.count} точек<br>Неполная точка не считается нулём</div></section><section class="card metric"><div class="label">На сопоставимых точках</div><div class="value ${s.delta<0?"negative":s.delta>0?"positive":""}">${s.rate===null?"Нет сравнения":(s.rate>0?"+":"")+percent(s.rate)}</div><div class="foot">${s.pairs?money(s.base)+" → "+money(s.paired):"Нужны полные данные обоих месяцев"}<br>${s.pairs} из ${s.count} точек в сравнении</div></section><section class="card metric"><div class="label">Выполнение плана · известные точки</div><div class="value">${percent(s.planRate)}</div><div class="foot">${s.known?money(s.current)+" из "+money(s.plan):"Нет факта для сравнения с планом"}<br>План посчитан для тех же ${s.known} точек</div></section></div><div class="quality"><div class="chips"><span class="pill ok">${s.pairs} · оба месяца полные</span>${s.fresh?`<span class="pill warn">${s.fresh} · новая точка</span>`:""}${s.missing?`<span class="pill bad">${s.missing} · нет сентября</span>`:""}</div><span>Новые и неполные точки исключены только из сравнения периодов.</span></div>`;}
function pointRows(list){return list.map(p=>`<tr><td><button class="link cellmain" data-point="${p.id}">${p.id} · ${esc(p.name)}</button><div class="cellsub">${esc(p.city)} · ${esc(p.entity)}</div></td><td class="num">${p.base===null?'<span class="muted">Новая точка</span>':money(p.base)}</td><td class="num"><strong>${p.current===null?'<span class="muted">Нет данных</span>':money(p.current)}</strong></td><td class="num"><strong class="${change(p)<0?"negative":change(p)>0?"positive":""}">${signed(change(p))}</strong><div class="cellsub">${rate(p)===null?"Не сравнивается":(rate(p)>0?"+":"")+percent(rate(p))}</div></td><td class="num">${percent(p.current===null?null:p.current/p.plan*100)}<div class="cellsub">План ${money(p.plan)}</div></td><td>${quality(p)}</td></tr>`).join("");}
function pointTable(list){return`<div class="scroll" tabindex="0" role="region" aria-label="Финансовая таблица точек, можно прокручивать"><table class="financial"><thead><tr><th>Точка</th><th class="num">Август</th><th class="num">Сентябрь</th><th class="num">Изменение</th><th class="num">План сентября</th><th>Качество данных</th></tr></thead><tbody>${pointRows(list)}</tbody></table></div>`;}
function cityTable(list){const cities=[...new Set(list.map(p=>p.city))];return`<div class="scroll" tabindex="0" role="region" aria-label="Сравнение городов, можно прокручивать"><table class="financial"><thead><tr><th>Город</th><th class="num">Продажи сентября</th><th class="num">Изменение на сопоставимых</th><th class="num">План · известные точки</th><th>Данные</th></tr></thead><tbody>${cities.map(c=>{const s=stats(list.filter(p=>p.city===c));return`<tr><td><button class="link cellmain" data-city="${esc(c)}">${esc(c)} →</button><div class="cellsub">${s.count} точки в доступной области</div></td><td class="num"><strong>${s.known?money(s.current):"Нет данных"}</strong><div class="cellsub">${s.known} из ${s.count} точек</div></td><td class="num"><strong class="${s.delta<0?"negative":s.delta>0?"positive":""}">${s.rate===null?"—":(s.rate>0?"+":"")+percent(s.rate)}</strong><div class="cellsub">${s.pairs?`${signed(s.delta)} · ${s.pairs} точки`:"Нет полного сравнения"}</div></td><td class="num">${percent(s.planRate)}<div class="cellsub">План ${money(s.plan)}</div></td><td>${s.missing?'<span class="pill bad">Есть пропуск</span>':s.fresh?'<span class="pill warn">Есть новая точка</span>':'<span class="pill ok">Полные периоды</span>'}</td></tr>`;}).join("")}</tbody></table></div>`;}
function querySQL(list){return`SELECT t0."point_id", t0."august_sales", t0."september_sales",\n       t0."september_sales" - t0."august_sales" AS "change"\nFROM "demo"."point_period_metrics" AS t0\nWHERE t0."point_id" IN (${list.map(p=>"'"+p.id+"'").join(", ")})\n  AND t0."august_sales" IS NOT NULL\n  AND t0."september_sales" IS NOT NULL\n  AND t0."september_sales" < t0."august_sales"\nORDER BY "change" ASC;`;}
function questionBox(list){const found=list.filter(p=>comparable(p)&&p.current<p.base);return`<section class="card question"><h3>Вопрос к данным</h3><p>В этом макете подготовлен один вопрос. Ответ выбирается из демонстрационных данных вашей области; модель не вызывается.</p><label class="sr" for="question">Вопрос к данным</label><div class="askline"><input id="question" value="${esc(question)}" autocomplete="off"><button class="primary" id="ask">Показать подготовленный ответ</button></div>${queryError?`<div class="error" role="alert">${esc(queryError)}${queryReady?" Предыдущий подготовленный ответ сохранён ниже.":""}</div>`:""}${queryReady?`<div class="prepared"><span class="pill">Подготовленный ответ · ${snapshot}</span><p>${found.length?"Снижение есть у следующих сопоставимых точек.":"В вашей области нет сопоставимых точек со снижением."} Новые точки и точки без данных сентября не участвуют.</p>${found.length?pointTable(found):""}<details><summary>SQL этого подготовленного ответа</summary><p>Эскиз запроса над подготовленной таблицей показателей. SQL в макете не исполняется; реальный сервер должен сам ограничивать доступ.</p><pre class="code">${esc(querySQL(list))}</pre></details></div>`:""}</section>`;}
function overview(){const list=visible(),local=allowed().length<points.length,title=city?city+" · точки":nav==="points"?"Точки в вашей области":local?roles[role].scope:"Обзор сети",description=local?"Сравнение и разборы только в вашей области доступа.":"Сначала сопоставимость и полнота, затем изменение конкретной точки.";return`${heading(title,description)}${city?'<button class="quiet back" id="allCities">← Вся доступная область</button>':""}${metrics(list)}<section class="card"><div class="panelhead"><div><h2>${nav==="overview"&&!local&&!city?"Города сети":"Финансовая таблица точек"}</h2><p>Выберите город или точку, чтобы перейти к предметному разбору.</p></div><div class="tabs" role="group" aria-label="Вид таблицы"><button data-view="overview" class="${nav==="overview"?"active":""}" aria-pressed="${nav==="overview"}">Города</button><button data-view="points" class="${nav==="points"?"active":""}" aria-pressed="${nav==="points"}">Точки</button></div></div>${nav==="overview"&&!local&&!city?cityTable(list):pointTable(list)}<div class="tablefoot">Продажи после возвратов. Сравнение на сопоставимых точках — только при полных данных обоих месяцев. Это не прибыль и не доход франчайзера.</div></section>${questionBox(list)}`;}
function pointDetails(p){const d=change(p);return`<div class="detailfacts"><div class="fact"><span>Август</span><strong>${p.base===null?"Новая точка":money(p.base)}</strong></div><div class="fact"><span>Сентябрь</span><strong>${money(p.current)}</strong></div><div class="fact"><span>Изменение</span><strong class="${d<0?"negative":d>0?"positive":""}">${signed(d)}</strong><small>${rate(p)===null?"Нет сопоставимого периода":percent(rate(p))}</small></div><div class="fact"><span>Выполнение плана</span><strong>${percent(p.current===null?null:p.current/p.plan*100)}</strong><small>План ${money(p.plan)}</small></div></div>${quality(p)}<dl class="keyvalues"><dt>Город</dt><dd>${esc(p.city)}</dd><dt>Партнёр</dt><dd>${esc(p.entity)}</dd><dt>Показатель</dt><dd>Продажи после возвратов</dd><dt>Данные</dt><dd>${snapshot}</dd></dl>`;}
function openPoint(id){const p=allowed().find(p=>p.id===id);if(!p)return;selectedPoint=id;$("pointContent").innerHTML=`<div class="drawerhead"><div><p class="eyebrow">Точка ${p.id}</p><h2 id="pointTitle">${esc(p.name)}</h2></div><button class="close" id="closePoint" aria-label="Закрыть точку">×</button></div><div class="drawerbody"><p class="small">Сентябрь против августа 2026 · RUB</p>${pointDetails(p)}<div class="strongnote">${p.current===null?"Сентябрь отсутствует. Сохранённый разбор может быть посвящён полноте данных, но отсутствие не считается нулевыми продажами.":p.base===null?"Новая точка учитывается в известных продажах и плане. Изменение к августу не рассчитывается.":"Эти числа показывают изменение продаж. Объяснение условий работы точки даёт управляющий обычным комментарием."}</div>${roles[role].create?'<div class="actions"><button class="primary" id="savePoint">Сохранить разбор по этой точке</button></div><p class="small spaced">В разбор войдут только данные выбранной точки.</p>':'<p class="small spaced">Вы можете ответить на адресованный этой точке вопрос в разделе «Разборы».</p>'}</div>`;$("closePoint").onclick=()=>$("pointDialog").close();if($("savePoint"))$("savePoint").onclick=createAnalysis;$("pointDialog").showModal();$("closePoint").focus();}
function createAnalysis(){const p=allowed().find(p=>p.id===selectedPoint);if(!p||!roles[role].create)return;const a={id:"Р-"+String(nextId++).padStart(3,"0"),point:clone(p),snapshot,status:"saved",creatorRole:role,creator:roles[role].name,request:null,response:null,outcome:null};analyses.push(a);selectedAnalysis=a.id;nav="analyses";city=null;$("pointDialog").close();say("Сохранён разбор "+a.id+" только по точке "+p.id+". Можно задать вопрос её управляющему.");render();focusMain();}
function analysisList(){const items=accessibleAnalyses();return`${heading(role==="manager"?"Вопросы по вашей точке":"Разборы точек","Один разбор — одна точка, зафиксированные показатели и разговор по существу.")}${items.length?`<section class="card"><div class="scroll"><table><thead><tr><th>Разбор</th><th>Точка</th><th>Состояние</th><th>Инициатор</th></tr></thead><tbody>${items.map(a=>`<tr><td><button class="link cellmain" data-analysis="${a.id}">${a.id}</button></td><td>${a.point.id} · ${esc(a.point.name)}<div class="cellsub">${esc(a.point.city)}</div></td><td><span class="pill ${a.status==="waiting"?"warn":a.status==="done"?"ok":""}">${labels[a.status]}</span></td><td>${esc(a.creator)}</td></tr>`).join("")}</tbody></table></div></section>`:`<section class="card empty"><div class="symbol" aria-hidden="true">▤</div><h2>${role==="manager"?"По этой точке пока нет вопросов":"Разборов пока нет"}</h2><p>${role==="manager"?"Здесь появится разбор, адресованный вашей точке. Общие показатели сети и чужие точки не передаются.":"Откройте точку в финансовой таблице и сохраните её показатели. Затем можно запросить предметное пояснение управляющего."}</p>${roles[role].create?'<button class="primary" data-go-points>Открыть точки</button>':""}</section>`}`;}
function analysisView(a){const canAsk=roles[role].create&&a.creatorRole===role&&a.status==="saved",canReply=role==="manager"&&a.point.id==="М1"&&a.status==="waiting",canFinish=roles[role].create&&a.creatorRole===role&&a.status==="answered";return`${heading(a.point.id+" · "+a.point.name,"Разбор "+a.id+" · только выбранная точка · данные зафиксированы при сохранении")}<button class="quiet back" id="backAnalyses">← Все доступные разборы</button><div class="twocol"><section class="card"><div class="section"><div class="statusline"><span class="pill ${a.status==="waiting"?"warn":a.status==="done"?"ok":""}">${labels[a.status]}</span><span class="small">Инициатор: ${esc(a.creator)}</span></div><h2 class="spaced">${a.point.current===null?"Уточнить полноту данных":a.point.base===null?"Первый месяц новой точки":"Изменение продаж точки"}</h2><p class="explanation spaced">${a.point.current===null?"Нет факта за сентябрь. Размер изменения пока неизвестен.":a.point.base===null?"За сентябрь известно "+money(a.point.current)+". Сравнения с августом нет.":"Август "+money(a.point.base)+", сентябрь "+money(a.point.current)+". Изменение "+signed(change(a.point))+" ("+percent(rate(a.point))+")."} Это описание показателей, а не автоматически установленная причина.</p><div class="thread">${a.request?`<article class="message"><div class="who">${esc(a.request.author)} → управляющему ${a.point.id}</div><p>${esc(a.request.text)}</p><div class="meta">Обычный комментарий · относится к этому разбору</div></article>`:""}${a.response?`<article class="message manager"><div class="who">Управляющий ${a.point.id} · ответ</div><p>${esc(a.response.text)}</p><div class="meta">Сообщение человека · не подтверждает причинность само по себе</div></article>`:""}${a.outcome?`<article class="message"><div class="who">Итог · ${esc(a.outcome.author)}</div><p>${esc(a.outcome.text)}</p><div class="meta">Показатели исходного снимка не изменились</div></article>`:""}</div>${canAsk?'<label class="commentlabel" for="comment">Вопрос управляющему точки</label><textarea id="comment" maxlength="1600" placeholder="Например: проверьте, были ли дни с сокращённым временем работы. Укажите даты и источник информации."></textarea><div class="actions"><button class="primary" id="sendQuestion">Задать вопрос</button></div><p class="small spaced">Сообщение появится только в этом разборе. Внешняя отправка не выполняется.</p>':canReply?'<label class="commentlabel" for="comment">Ваш ответ</label><textarea id="comment" maxlength="1600" placeholder="Опишите проверенные обстоятельства работы точки и что ещё предстоит уточнить."></textarea><div class="actions"><button class="primary" id="sendAnswer">Добавить ответ</button></div><p class="small spaced">Это обычный комментарий управляющего. Продажи и сравнение остаются исходными.</p>':canFinish?'<label class="commentlabel" for="comment">Итог разбора</label><textarea id="comment" maxlength="1600" placeholder="Что выяснили, что подтверждено и что ещё нужно проверить?"></textarea><div class="actions"><button class="primary" id="finish">Зафиксировать итог</button></div>':a.status==="waiting"?'<div class="strongnote">Вопрос задан. В демонстрации роль управляющего доступна для М1; ответ добавляется вручную через переключатель роли.</div>':a.status==="saved"?'<p class="small spaced">Разбор сохранён. Инициатор ещё не задал вопрос управляющему.</p>':""}</div></section><aside class="card"><div class="section"><h3>Показатели этой точки</h3>${pointDetails(a.point)}<p class="small">Общая сводка сети в разбор не включается.</p></div><div class="section"><h3>Что означает итог</h3><p class="explanation spaced">Участники зафиксировали результат обсуждения. Комментарий не меняет бухгалтерские данные и не становится доказательством причины снижения.</p></div></aside></div>`;}
function sendComment(kind){const a=analysis(),text=$("comment")?.value.trim();if(!a||!text){if($("comment")){$("comment").setCustomValidity("Напишите сообщение.");$("comment").reportValidity();}return;}if(kind==="question"&&roles[role].create&&a.creatorRole===role&&a.status==="saved"){a.request={author:roles[role].name,text};a.status="waiting";say("Вопрос сохранён в разборе "+a.id+" для управляющего "+a.point.id+".");}else if(kind==="answer"&&role==="manager"&&a.point.id==="М1"&&a.status==="waiting"){a.response={text};a.status="answered";say("Ответ управляющего добавлен. Инициатор может зафиксировать итог.");}else if(kind==="finish"&&roles[role].create&&a.creatorRole===role&&a.status==="answered"){a.outcome={author:roles[role].name,text};a.status="done";say("Итог сохранён вместе с показателями и обсуждением.");}else return;render();focusMain();}
function dataView(){if(!roles[role].data)return`<section class="card empty"><h2>Настройка источников доступна аналитику</h2></section>`;return`${heading("Данные сети","Подключение к базе и полнота по точкам — отдельная ответственность аналитика.")}<section class="card"><div class="sourcepanel"><div><p class="eyebrow">Подключение к БД · демонстрация</p><h2 class="spaced">PostgreSQL / показатели точек</h2><p>Реального подключения нет. В макет встроен фиксированный набор за август и сентябрь 2026.</p><div class="spaced"><span class="pill">${snapshot}</span> <span class="pill bad">Не подключено</span></div></div><div class="sourceicon" aria-hidden="true">◉</div></div><div class="section"><h3>Что потребуется согласовать при подключении</h3><div class="sourcecheck explanation"><div>Идентификатор точки и принадлежность партнёру/региону.</div><div>Показатель продаж после возвратов, даты учёта и валюта.</div><div>Полнота обоих периодов и отдельный признак новой точки.</div><div>Доступ только на чтение; ограничения данных проверяются сервером.</div></div></div></section><section class="card spaced"><div class="panelhead"><div><h2>Покрытие демонстрационного набора</h2><p>Отсутствие сентября нельзя автоматически заменить нулём.</p></div></div>${pointTable(allowed())}</section>`;}
function render(){if(nav==="data"&&!roles[role].data)nav="overview";if(city&&!allowed().some(p=>p.city===city))city=null;$("role").value=role;document.querySelector('[data-nav="overview"]').innerHTML='<span class="icon" aria-hidden="true">◫</span>'+(allowed().length===points.length?"Обзор сети":"Обзор");$("scopeName").textContent=roles[role].scope;$("scopeDescription").textContent=roles[role].description;$("analysisCount").textContent=accessibleAnalyses().length;$("dataNav").hidden=!roles[role].data;document.querySelectorAll("[data-nav]").forEach(b=>{b.classList.toggle("active",b.dataset.nav===nav);b.setAttribute("aria-current",b.dataset.nav===nav?"page":"false");});$("crumb").textContent=roles[role].scope+" / "+({overview:"Обзор",points:"Точки",analyses:"Разборы",data:"Данные"}[nav]);const a=analysis(),content=nav==="data"?dataView():nav==="analyses"?(a?analysisView(a):analysisList()):overview();$("main").innerHTML=(notice?`<div class="notice">${esc(notice)}</div>`:"")+content+'<footer class="footer">Вымышленные данные. Это демонстрация интерфейса, а не готовый SaaS. Переключатель ролей не защищает встроенную в HTML фикстуру. <button id="reset">Сбросить демонстрацию</button></footer>';bind();}
function focusMain(){$("main").tabIndex=-1;$("main").focus({preventScroll:true});}
function bind(){document.querySelectorAll("[data-point]").forEach(b=>b.onclick=()=>openPoint(b.dataset.point));document.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{city=b.dataset.city;nav="points";queryReady=false;queryError="";notice="";render();focusMain();});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{nav=b.dataset.view;notice="";render();});document.querySelectorAll("[data-analysis]").forEach(b=>b.onclick=()=>{selectedAnalysis=b.dataset.analysis;notice="";render();focusMain();});document.querySelectorAll("[data-go-points]").forEach(b=>b.onclick=()=>{nav="points";city=null;render();});if($("allCities"))$("allCities").onclick=()=>{city=null;queryReady=false;queryError="";render();};if($("backAnalyses"))$("backAnalyses").onclick=()=>{selectedAnalysis=null;notice="";render();};if($("question")){$("question").oninput=e=>{question=e.target.value;};$("question").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();askQuestion();}};$("ask").onclick=askQuestion;}if($("sendQuestion"))$("sendQuestion").onclick=()=>sendComment("question");if($("sendAnswer"))$("sendAnswer").onclick=()=>sendComment("answer");if($("finish"))$("finish").onclick=()=>sendComment("finish");if($("comment"))$("comment").oninput=()=>$("comment").setCustomValidity("");$("reset").onclick=()=>{analyses=[];nextId=1;selectedAnalysis=null;selectedPoint=null;role="director";nav="overview";city=null;question=example;queryReady=false;queryError="";notice="";if($("pointDialog").open)$("pointDialog").close();$("pointContent").innerHTML="";render();};}
function askQuestion(){if(question.trim()!==example){queryError="В этом макете поддержан только показанный первоначальный вопрос. Произвольный вопрос не передаётся модели.";}else{question=example;queryError="";queryReady=true;}render();if($("ask"))$("ask").focus({preventScroll:true});}
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{if(b.dataset.nav==="data"&&!roles[role].data)return;nav=b.dataset.nav;city=null;selectedAnalysis=null;queryReady=false;queryError="";notice="";render();focusMain();});
$("role").onchange=e=>{role=e.target.value;city=null;selectedPoint=null;queryReady=false;queryError="";question=example;notice="";$("live").textContent="";if($("pointDialog").open)$("pointDialog").close();$("pointContent").innerHTML="";const available=accessibleAnalyses();selectedAnalysis=role==="manager"&&available.length?available[0].id:null;nav=selectedAnalysis?"analyses":"overview";render();};
render();
</script>
</body>
</html>
