<div class="shell"><aside class="sidebar"><div class="logo"><span class="logo-symbol">≋</span>сверка</div><div><div class="space-label">Команда / Север</div><nav class="nav" aria-label="Разделы"><button data-action="nav" data-page="rule"><span class="nav-icon">▤</span>Правило</button><button data-action="nav" data-page="cases"><span class="nav-icon">◫</span>Случаи</button><button data-action="nav" data-page="sources"><span class="nav-icon">▧</span>Источники</button></nav></div><div class="sidebar-bottom">От отличия в данных<br>до проверенного результата.<br><br><a href="index.html">← Все концепции</a><br><a href="../../research/three-concepts/reconciliation.md">Описание концепции ↗</a></div></aside><div class="workspace"><header class="topbar"><div class="crumb">Команда Север &nbsp; / &nbsp; <b>Заказы и оплаты</b></div><div class="person" id="person"></div></header><main class="content" id="main"></main></div></div><div class="toast" role="status" aria-live="polite" hidden id="toast"></div>
<script>
const orders=[{id:'З-101',name:'Мастерская № 4',amount:12000000,due:'2026-10-01',state:'shipped'},{id:'З-102',name:'Бюро «Форма»',amount:8500000,due:'2026-09-30',state:'shipped'},{id:'З-103',name:'Студия «Луч»',amount:4700000,due:'2026-09-29',state:'shipped'},{id:'З-104',name:'Дом проекта',amount:9600000,due:'2026-10-05',state:'shipped'},{id:'З-105',name:'Ателье «Линия»',amount:6400000,due:'2026-09-30',state:'shipped'},{id:'З-106',name:'Отдел «Юг»',amount:3300000,due:'2026-10-01',state:'cancelled'},{id:'З-107',name:'Склад «Ритм»',amount:2800000,due:'2026-09-30',state:'shipped'}];
const basePayments=[{id:'П-101-1',order:'З-101',amount:12000000,date:'2026-09-30'},{id:'П-102-1',order:'З-102',amount:6000000,date:'2026-09-29'},{id:'П-103-1',order:'З-103',amount:2700000,date:'2026-09-28'},{id:'П-103-2',order:'З-103',amount:2500000,date:'2026-09-29'},{id:'П-107-1',order:'З-107',amount:2800000,date:'2026-09-30'}];
const correction={id:'П-102-2',order:'З-102',amount:2500000,date:'2026-10-03'};
const people={analyst:['Мария Орлова','Аналитик','МО'],coordinator:['Илья Соколов','Координатор','ИС'],assignee:['Алина Белова','Ответственный','АБ'],steward:['Олег Морозов','Управляющий источниками','ОМ']};
const names={base:'Оплаты · v1, 3 октября 09:00',partial:'Оплаты · v2, только 3 октября',full:'Оплаты · v3, 3 октября 13:00'};
let state,toastTimer;
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n/100)+' ₽';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s.split('-').reverse().join('.');
const can=(...roles)=>roles.includes(state.role);
const disabled=(...roles)=>can(...roles)?'':'disabled';
function initial(){state={page:'rule',role:'analyst',approved:false,source:'base',lastGood:'base',selected:'З-102',filter:'all',cases:{},runs:[],attempt:0,draftRule:false};document.getElementById('role').value=state.role;render()}
function payments(version){return version==='partial'?[correction]:version==='full'?[...basePayments,correction]:basePayments}
function calculate(version){return orders.map(o=>{const rows=payments(version).filter(p=>p.order===o.id);const paid=rows.reduce((sum,p)=>sum+p.amount,0);const delta=paid-o.amount;const kind=o.state==='cancelled'?'excluded':o.due>='2026-10-03'?'waiting':delta===0?'matched':delta<0?'short':'over';return{...o,rows,paid,delta,kind}})}
function record(c,text){c.history.unshift({text,at:'Действие '+(++state.attempt)})}
function visibleCases(){return Object.values(state.cases).filter(c=>state.role!=='assignee'||c.assignee==='Алина Белова').filter(c=>state.filter!=='open'||!['closed','accepted'].includes(c.work)).filter(c=>state.filter!=='mine'||c.assignee===people[state.role][0])}
function workLabel(c){return{new:'Не назначено',assigned:'В работе',claimed:'Заявлено исправление',closed:'Завершено',explained:'Объяснение получено',accepted:'Разобрано с основанием',rule_review:'Уточнить правило'}[c.work]}
function workClass(c){return{new:'amber',assigned:'blue',claimed:'amber',closed:'green',explained:'blue',accepted:'blue',rule_review:'amber'}[c.work]}
function evidenceLabel(c){return c.current.delta===0?'Подтверждено данными':'Различие подтверждено'}
function notify(text){const box=document.getElementById('toast');box.textContent=text;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,6000)}
function run(){if(!can('analyst','coordinator'))return;if(!state.approved){notify('Сначала аналитик утверждает правило.');return}const n=state.runs.length+1;if(state.source==='partial'){state.runs.unshift({n,source:state.source,ok:false,message:'Не выполнена: новая выгрузка не содержит полной истории оплат.'});Object.values(state.cases).forEach(c=>{c.unverified=true;record(c,'Попытка № '+n+': охват оплат неполный. Последний подтверждённый результат сохранён.')});state.page='cases';render();notify('Перепроверка остановлена: суточная выгрузка не заменяет всю историю. Случаи не закрыты.');return}const results=calculate(state.source);results.forEach(r=>{let c=state.cases[r.id];const isNew=!c;if(['short','over'].includes(r.kind)&&!c){c={id:r.id,identity:'balance-v1:sever:'+r.id,current:r,work:'new',assignee:null,history:[],unverified:false};state.cases[r.id]=c;record(c,'Найдено различие: '+money(Math.abs(r.delta))+'. Правило v1, запуск № '+n+'.')}if(c){const previous=c.current.delta;if(!isNew&&c.version!==state.source)c.paymentDiff=comparePayments(c.current,r,c.version,state.source);c.current=r;c.version=state.source;c.unverified=false;if(c.work==='accepted'&&r.delta!==previous){c.work='assigned';record(c,'Изменилась сумма. Объяснение требует новой проверки.')}if(r.delta===0&&previous!==0)record(c,'Проверка № '+n+': сумма оплат '+money(r.paid)+' совпала с заказом. Данные '+names[state.source]+'.');else if(r.delta!==0&&previous===0){c.work='assigned';record(c,'Расхождение появилось снова. Новый эпизод прежнего случая.')}else if(!isNew&&c.history.length)record(c,'Проверка № '+n+': '+(r.delta===0?'совпадение подтверждено повторно':'различие сохраняется')+'. Новая карточка не создавалась.')}});state.lastGood=state.source;state.runs.unshift({n,source:state.source,ok:true,message:results.filter(r=>['short','over'].includes(r.kind)).length+' текущих расхождения; '+Object.keys(state.cases).length+' сохранённых случая.'});state.page='cases';render();notify('Проверка № '+n+' завершена. История и назначения сохранены.')}
function header(eyebrow,title,lead,actions=''){return'<div class="page-title"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p></div><div class="actions">'+actions+'</div></div>'}
function renderRule(){if(state.role==='assignee')return header('01 / смысл проверки','Что проверяется в моих случаях','Сумма отгруженного заказа сравнивается с подтверждёнными оплатами по точному ключу после договорного срока.')+'<section class="panel"><h2>Правило v1 · ООО «Север»</h2><p>Область: отгруженные заказы сентября. Валюта RUB, допуск 0 ₽. Частичные оплаты суммируются; пустые ключи не подменяются отсутствующей оплатой.</p><p class="muted">Исходные записи и суммы доступны внутри назначенного случая. Полный каталог источников здесь не раскрывается.</p><button class="primary" data-action="nav" data-page="cases">Открыть мои случаи</button></section>';return header('01 / понятное правило','Что должно сходиться','Объясните задачу словами. Перед запуском проверьте, как приложение поняло связь и условия.','<span class="badge '+(state.approved?'green':'amber')+'">'+(state.approved?'Правило v1 утверждено':'Черновик · требует проверки')+'</span>')+'<section class="panel"><div class="small-text muted">Задача команды</div><p class="quote">«Покажи отгруженные заказы сентября, по которым уже прошёл срок оплаты, но сумма оплат не совпадает с суммой заказа».</p><div class="sample-row"><span class="badge blue">Пример</span><span>В концепции показана заранее подготовленная интерпретация вопроса. Модель в браузере не запускается.</span></div></section><div class="rule-grid"><section class="panel"><div class="panel-head"><div><h2>Так будет работать проверка</h2><p class="muted small-text">Сначала смысл расчёта, затем исполнение.</p></div><span class="badge">v1</span></div><dl class="definition"><dt>Один объект</dt><dd>Заказ: организация + номер заказа</dd><dt>Сравнение</dt><dd>Сумма заказа ↔ сумма подтверждённых оплат</dd><dt>Связь записей</dt><dd>Точный ключ заказа в каждом платеже</dd><dt>Область</dt><dd>Отгружено в сентябре · ООО «Север»</dd><dt>Срок</dt><dd>Срок оплаты раньше 3 октября 2026</dd><dt>Деньги</dt><dd>RUB · допуск 0 ₽ · частичные оплаты суммируются</dd></dl><div class="note">Заказы до срока оплаты попадут в ожидание. Пустой ключ не будет считаться отсутствующей оплатой.</div><details><summary>Логика исполнения и ограничения</summary><pre>1. Проверить ключи, суммы, валюту и охват.\n2. Выбрать отгруженные заказы сентября.\n3. Сложить подтверждённые оплаты по ключу заказа.\n4. Сравнить суммы после наступления срока.\n5. Сохранить наблюдение с версиями источников.</pre><p class="small-text muted">Это описание типизированного правила. Текущая SQL-грамматика проекта не умеет произвольную сверку; движок правила ещё потребуется реализовать.</p></details>'+(state.draftRule?'<div class="rule-revision"><strong>Черновик v2</strong><p>Предлагается учитывать заказы со сроком 3 октября включительно. Старые наблюдения и активное v1 сохранены. Перед применением нужен новый просмотр области и утверждение.</p><button class="small" data-action="discard-rule">Отменить черновик</button></div>':'')+'<div class="rule-foot"><span class="small-text muted">'+(state.approved?'Утвердила Мария Орлова · версия 1':'Утверждает аналитик после проверки примеров')+'</span><div class="actions">'+(state.approved?'<button data-action="draft-rule" '+disabled('analyst')+'>Предложить изменение</button><button class="primary" data-action="run" '+disabled('analyst','coordinator')+'>Запустить сверку</button>':'<button class="primary" data-action="approve" '+disabled('analyst')+'>Утвердить и запустить</button>')+'</div></div></section><aside class="panel"><h2>На каких данных</h2><div class="source-mini"><div class="source-icon">▤</div><div><strong>Заказы · v1</strong><span>7 заказов · сентябрь 2026</span></div></div><div class="source-mini"><div class="source-icon">▤</div><div><strong>'+names[state.source].split(',')[0]+'</strong><span>'+payments(state.source).length+' записей · выбранная версия</span></div></div><span class="badge '+(state.source==='partial'?'amber':'green')+'">'+(state.source==='partial'?'Охват несопоставим':'Охват заявлен полным')+'</span><p class="small-text muted" style="margin-top:12px">В демо полнота задана фикстурой. В продукте здесь видны основание, период и подтвердивший человек.</p><div class="divider"></div><h3>Проверка качества</h3><div class="note">Пустых ключей и повторных идентификаторов в этой выборке нет. Все участвующие оплаты связаны с заказами.</div><p class="small-text muted">Исключено: 1 отменённый заказ. Ожидает срока: 1 заказ. Уникальность ключей проверена в демонстрационных данных.</p><button class="link" data-action="nav" data-page="sources">Посмотреть версии и записи →</button></aside></div>'}
function renderMetrics(){const r=calculate(state.lastGood);const relevant=state.role==='assignee'?r.filter(x=>state.cases[x.id]?.assignee==='Алина Белова'):r;const bad=relevant.filter(x=>['short','over'].includes(x.kind));const shortage=bad.filter(x=>x.delta<0).reduce((s,x)=>s-x.delta,0);const over=bad.filter(x=>x.delta>0).reduce((s,x)=>s+x.delta,0);return'<div class="metrics"><div class="metric accent"><div class="label">'+(state.role==='assignee'?'Назначено мне':'Текущие расхождения')+'</div><div class="number">'+(state.role==='assignee'?visibleCases().length:bad.length)+'</div><div class="sub">'+(state.role==='assignee'?'В пределах доступа':'По последней полной проверке')+'</div></div><div class="metric"><div class="label">Недоплата</div><div class="number">'+money(shortage)+'</div><div class="sub">По полной версии оплат</div></div><div class="metric"><div class="label">Переплата</div><div class="number">'+money(over)+'</div><div class="sub">По полной версии оплат</div></div><div class="metric"><div class="label">'+(state.role==='assignee'?'Ожидают перепроверки':'Ещё не наступил срок')+'</div><div class="number">'+(state.role==='assignee'?visibleCases().filter(c=>c.work==='claimed'&&c.current.delta!==0).length:r.filter(x=>x.kind==='waiting').length)+'</div><div class="sub">'+(state.role==='assignee'?'Заявлено, но не подтверждено':'Заказ З-104 · до 5 октября')+'</div></div></div>'}
function renderCases(){if(!state.approved||!state.runs.length)return header('02 / очередь команды','Сначала определим правило','Результат появится после первого запуска утверждённого правила.')+'<div class="panel empty"><h2>Проверок ещё не было</h2><p>Нужно согласовать связь заказов и оплат, а также область данных.</p><button class="primary" data-action="nav" data-page="rule">Открыть правило</button></div>';const cases=visibleCases();if(!cases.some(c=>c.id===state.selected))state.selected=cases[0]?.id||null;const selected=state.cases[state.selected];return header('02 / от расхождения к действию',state.role==='assignee'?'Мои случаи':'Отгрузки и оплаты',state.role==='assignee'?'Здесь только назначенные Алине случаи. Полный реестр команды ей недоступен.':'ООО «Север» · отгрузки сентября. Откройте расхождение, назначьте ответственного и проверьте результат.',''+(state.role==='assignee'?'':'<button data-action="nav" data-page="sources">Обновить данные</button><button class="primary" data-action="run" '+disabled('analyst','coordinator')+'>Перепроверить</button>')+'')+renderMetrics()+(state.source==='partial'?'<div class="note warning"><strong>Выбран неполный комплект оплат.</strong> В нём только платежи 3 октября. Он не подтверждает исправление; ниже сохранён результат последней полной проверки. <button class="link" data-action="nav" data-page="sources">Выбрать полный источник →</button></div>':'')+'<div class="case-layout"><section class="panel case-list"><div class="list-top"><div class="split"><h3>Случаи <span class="muted">'+cases.length+'</span></h3><span class="badge">Правило v1</span></div><div class="filters" aria-label="Фильтр случаев"><button class="'+(state.filter==='all'?'selected':'')+'" data-action="filter" data-filter="all">Все</button><button class="'+(state.filter==='open'?'selected':'')+'" data-action="filter" data-filter="open">Активные</button><button class="'+(state.filter==='mine'?'selected':'')+'" data-action="filter" data-filter="mine">Мои</button></div></div>'+(cases.length?cases.map(c=>'<button class="case-item '+(c.id===state.selected?'active':'')+'" data-action="select" data-id="'+c.id+'" aria-pressed="'+(c.id===state.selected)+'"><div class="row"><strong>'+c.id+'</strong><span class="amount" style="'+(c.current.delta===0?'color:var(--green)':'')+'">'+(c.current.delta===0?'Совпало':money(Math.abs(c.current.delta)))+'</span></div><div class="small-text muted">'+c.current.name+' · '+(c.current.delta===0?'различие устранено':c.current.delta<0?'недоплата':'переплата')+'</div><div style="margin-top:10px"><span class="badge '+workClass(c)+'">'+workLabel(c)+'</span></div><div class="meta">'+(c.assignee||'Ответственный пока не выбран')+'</div></button>').join(''):'<div class="empty">'+(state.role==='assignee'?'Алине пока ничего не назначено. Координатор может назначить случай З-102.':'В этом представлении случаев нет.')+'</div>')+'</section>'+(selected&&cases.some(c=>c.id===selected.id)?renderDetail(selected):'<section class="panel empty"><h2>Здесь будет контекст случая</h2><p>Выберите строку очереди или измените фильтр.</p></section>')+'</div><div class="footer">'+(state.role==='assignee'?'Показаны только назначенные случаи.':'Основание: заказы v1 + '+names[state.lastGood]+'. Все участвующие записи прошли проверку ключей.')+' Это синтетические данные.</div>'}
function comparePayments(previous,next,fromVersion,toVersion){
const before=new Map(previous.rows.map(p=>[p.id,p]));
const after=new Map(next.rows.map(p=>[p.id,p]));
const changes=[];
for(const [id,p] of after){
const old=before.get(id);
if(!old)changes.push({id,kind:'added',before:null,after:p,delta:p.amount});
else if(old.amount!==p.amount||old.date!==p.date||old.order!==p.order)changes.push({id,kind:'changed',before:old,after:p,delta:p.amount-old.amount});
}
for(const [id,p] of before)if(!after.has(id))changes.push({id,kind:'removed',before:p,after:null,delta:-p.amount});
return {fromVersion,toVersion,fromPaid:previous.paid,toPaid:next.paid,changes};
}
function renderPaymentDiff(c){
const d=c.paymentDiff;
if(!d)return '';
const versionLabel=v=>v==='base'?'v1':v==='full'?'v3':'v2';
return '<section class="payment-diff" aria-label="Изменения оплат между полными версиями"><div class="split"><h3>Что изменилось в оплатах</h3><span class="badge">'+versionLabel(d.fromVersion)+' → '+versionLabel(d.toVersion)+'</span></div><div class="diff-total"><span>'+money(d.fromPaid)+'</span><span aria-hidden="true">→</span><strong>'+money(d.toPaid)+'</strong></div><p class="small-text muted">Учтённые оплаты · сравнение двух полных версий</p>'+(d.changes.length?d.changes.map(change=>'<div class="payment-change"><span class="badge '+(change.kind==='added'?'green':change.kind==='removed'?'red':'blue')+'">'+({added:'Добавлен',removed:'Удалён',changed:'Изменён'}[change.kind])+'</span><strong class="mono">'+esc(change.id)+'</strong><b>'+((change.delta>0?'+':change.delta<0?'−':'')+money(Math.abs(change.delta)))+'</b><div class="small-text muted">'+(change.kind==='changed'?'Сумма: '+money(change.before.amount)+' → '+money(change.after.amount)+'. Дата: '+fmtDate(change.before.date)+' → '+fmtDate(change.after.date):'Дата платежа: '+fmtDate((change.after||change.before).date))+'</div></div>').join(''):'<p class="small-text"><strong>Оплаты не изменились.</strong> Состав, даты и суммы те же.</p>')+'</section>';
}
function renderDetail(c){const r=c.current;const resultClass=r.delta===0?'green':'red';const action=renderAction(c);return'<article class="panel case-detail"><div class="case-title"><div><div class="eyebrow">Случай СВ-'+c.id.slice(2)+'</div><h2>'+r.name+'</h2><p class="small-text muted">'+c.id+' · ООО «Север» · срок оплаты '+fmtDate(r.due)+'</p></div><span class="badge '+resultClass+'">'+(r.delta===0?'Суммы совпали':r.delta<0?'Недоплата':'Переплата')+'</span></div><div class="balance '+(r.delta===0?'good':'')+'"><div><label>СУММА ЗАКАЗА</label><b>'+money(r.amount)+'</b><small>Заказы · v1</small></div><div><label>УЧТЕНО ОПЛАТ</label><b>'+money(r.paid)+'</b><small>'+r.rows.length+' '+(r.rows.length===1?'платёж':'платежа')+'</small></div><div><label>'+(r.delta<0?'НЕ ХВАТАЕТ':r.delta>0?'СВЕРХ СУММЫ':'РАЗНИЦА')+'</label><b>'+money(Math.abs(r.delta))+'</b><small>По полной проверке</small></div></div>'+renderPaymentDiff(c)+'<div class="status-row"><div><div class="label">Работа человека</div><span class="badge '+workClass(c)+'">'+workLabel(c)+'</span></div><div><div class="label">Последняя полная проверка</div><strong style="color:var(--'+(r.delta===0?'green':'red')+')">'+evidenceLabel(c)+'</strong><div class="small-text muted">'+names[c.version||'base']+'</div></div></div>'+(c.unverified?'<div class="note warning"><strong>Новая попытка не завершена.</strong> Выбран неполный источник. Результат последней полной проверки выше сохраняется; нового подтверждения нет.</div>':'')+action+'<div class="panel-head" style="margin-bottom:10px"><h3>Какие оплаты учтены</h3><span class="small-text muted">'+names[c.version||'base'].split(',')[0]+'</span></div><div class="table-scroll"><table><thead><tr><th>Платёж</th><th>Дата</th><th class="money">Сумма</th></tr></thead><tbody>'+(r.rows.length?r.rows.map(p=>'<tr><td class="mono">'+p.id+'</td><td>'+fmtDate(p.date)+'</td><td class="money">'+money(p.amount)+'</td></tr>').join(''):'<tr><td colspan="3" class="muted">В полной версии источника связанных оплат нет.</td></tr>')+'</tbody></table></div><p class="small-text muted" style="margin-top:9px">Все строки связаны точным ключом «ООО Север + '+r.id+'». Суммы приведены в рублях.</p><details><summary>Основание и история · '+c.history.length+' событий</summary><p class="small-text muted" style="margin-top:12px">Стабильный ID: <span class="mono">'+c.identity+'</span>. Повторный запуск обновляет наблюдение этого случая.</p><ol class="timeline">'+c.history.map(h=>'<li>'+esc(h.text)+'<span class="time">'+h.at+' · демо-сессия</span></li>').join('')+'</ol></details></article>'}
function renderAction(c){
if(c.work==='closed')return '<div class="note"><strong>Случай завершён координатором.</strong><p style="margin:4px 0 0">Совпадение подтверждено: '+names[c.version]+'. История объяснения и проверок сохранена.</p></div>';
if(c.work==='accepted')return '<div class="note"><strong>Различие разобрано; суммы не менялись.</strong><p style="margin:6px 0">'+esc(c.decision)+'</p><p class="small-text">Основание сотрудника: '+esc(c.explanation)+'</p><p class="small-text">Вернуться к рассмотрению: '+fmtDate(c.reviewAt)+'. Если сумма изменится, случай откроется снова.</p>'+(can('coordinator')?'<button class="small" data-action="reopen">Вернуть в работу</button>':'')+'</div>';
if(c.work==='rule_review')return '<div class="note warning"><strong>Нужно уточнить применимость правила.</strong><p>'+esc(c.decision)+'</p><p class="small-text">Расчёт сохранён как наблюдение. Это не исправление исходных данных.</p>'+(can('analyst')?'<button class="small" data-action="review-rule">Открыть черновик правила</button>':'<p class="small-text">Следующий шаг: аналитик проверит условие и область правила.</p>')+'</div>';
if(c.current.delta===0&&!c.unverified)return '<div class="action-box"><h3>Данные подтвердили результат</h3><p class="small-text muted">Оплаты сошлись с заказом. Координатор может завершить случай после просмотра основания.</p><div class="actions"><button class="primary" data-action="close" '+disabled('coordinator')+'>Завершить проверенный случай</button></div>'+(!can('coordinator')?'<p class="small-text muted" style="margin-top:9px">Действие доступно координатору.</p>':'')+'</div>';
if(c.work==='new')return '<div class="action-box"><h3>Кто разберётся с отличием</h3><p class="small-text muted">Назначение сохраняется при следующем запуске. Оно не расширяет права сотрудника.</p><div class="actions"><select aria-label="Ответственный" id="assignee" '+disabled('coordinator')+'><option>Алина Белова</option><option>Дмитрий Власов</option></select><button class="primary" data-action="assign" '+disabled('coordinator')+'>Назначить</button></div>'+(!can('coordinator')?'<p class="small-text muted" style="margin-top:9px">Следующий шаг выполняет координатор. Смените роль в верхней панели демо.</p>':'')+'</div>';
if(c.work==='explained')return '<div class="action-box"><h3>Объяснение ответственного</h3><p class="small-text">'+esc(c.explanation)+'</p><p class="small-text muted">Объяснение не изменяет суммы и требует решения координатора.</p>'+(can('coordinator')?'<label for="decisionKind" style="margin-top:12px">Решение</label><select id="decisionKind"><option value="data">Данные верны, отличие объяснено</option><option value="rule">Нужно уточнить правило</option></select><label for="decision" style="margin-top:12px">Основание решения</label><textarea id="decision" placeholder="Каким документом или проверкой подтверждается объяснение?"></textarea><label for="reviewAt" style="margin-top:12px">Следующее рассмотрение</label><input type="date" id="reviewAt" value="2026-10-10" min="2026-10-04"><div class="actions"><button class="primary" data-action="accept-explanation">Сохранить решение</button></div>':'<p class="small-text muted">Следующий шаг: Илья рассматривает объяснение.</p>')+'</div>';
if(c.work==='claimed')return '<div class="action-box"><h3>Сотрудник сообщил об исправлении</h3><p class="small-text">'+esc(c.claimText||c.draft||'')+'</p><p class="small-text muted">Следующий шаг: Олег загружает полную версию оплат, затем аналитик или координатор повторяет проверку. Заявление пока не подтверждено новыми данными.</p>'+(can('assignee')?'<span class="badge amber">Ожидается обновление источника</span>':'<div class="actions"><button data-action="nav" data-page="sources">Посмотреть версии источника</button><button class="primary" data-action="run" '+disabled('analyst','coordinator')+'>Перепроверить</button></div>')+'</div>';
if(can('assignee')&&c.assignee==='Алина Белова')return '<div class="action-box"><label for="claim">Что выяснили или сделали</label><textarea id="claim">'+esc(c.draft||'')+'</textarea><p class="small-text muted" style="margin-top:7px">Если данные верны, объясните отличие. Если исправили источник, сообщите об исправлении. Оба заявления сохраняются отдельно от проверки.</p><div class="actions"><button data-action="explain">Объяснить отличие</button><button class="primary" data-action="claim">Сообщить об исправлении</button></div></div>';
return '<div class="action-box"><h3>В работе у '+esc(c.assignee)+'</h3><p class="small-text muted">Ответственный изучает записи и оставляет объяснение. Переключитесь на Алину, чтобы пройти этот шаг в демо.</p><span class="badge blue">Ожидается действие сотрудника</span></div>';
}
function renderSources(){if(state.role==='assignee')return header('03 / источники','Доступ ограничен','Ответственный видит доказательства в своих случаях, но не получает доступ ко всему реестру.')+'<div class="panel empty"><h2>Источники доступны управляющему</h2><p>Назначение отдельного случая не раскрывает чужие записи.</p><button data-action="nav" data-page="cases">Вернуться к моим случаям</button></div>';return header('03 / новая версия — новое основание','Изменились данные — проверим снова','Сначала область и полнота источника. Только затем можно делать вывод, исчезло ли расхождение.','<button class="primary" data-action="run" '+disabled('analyst','coordinator')+'>Перепроверить правило v1</button>')+'<div class="source-grid"><section class="panel"><div class="panel-head"><div><h2>Оплаты</h2><p class="small-text muted">В демонстрации доступны три подготовленных комплекта.</p></div><span class="badge">RUB</span></div>'+['base','partial','full'].map(v=>'<div class="source-option '+(state.source===v?'active':'')+'"><div><strong>'+names[v]+'</strong><p>'+(v==='base'?'История оплат до 3 октября, 09:00.':'partial'===v?'Только новый платёж 25 000 ₽. Старых оплат здесь нет.':'Полная история + новый платёж 25 000 ₽ по З-102.')+'</p><div style="margin-top:8px"><span class="badge '+(v==='partial'?'amber':'green')+'">'+(v==='partial'?'Охват несопоставим':'Полный охват в демо')+'</span></div></div><button class="small" data-action="source" data-version="'+v+'" '+(state.source===v||(v==='base'&&state.lastGood==='full')?'disabled':disabled('steward'))+'>'+(state.source===v?'Выбрано':v==='base'&&state.lastGood==='full'?'Архив':'Загрузить демоверсию')+'</button></div>').join('')+'<p class="small-text muted">Загрузка доступна управляющему источниками. В реальном продукте исходные файлы и метаданные версии сохраняются, а не перезаписывают историю.</p><div class="coverage"><strong>Заказы остаются на v1</strong><br>7 записей, ООО «Север», отгрузки сентября. Область заказов в этой демонстрации не меняется.</div></section><section class="panel"><div class="panel-head"><div><h2>Запуски и охват</h2><p class="small-text muted">Смена файла ещё не является новой проверкой.</p></div><span class="badge">'+state.runs.length+' запусков</span></div>'+(state.source==='partial'?'<div class="note warning"><strong>Этого файла недостаточно.</strong><p>Один новый платёж не заменяет всю историю. Последний подтверждённый результат сохранится; устранение недоплаты не будет объявлено.</p></div>':'<div class="note"><strong>Охват сопоставим.</strong><p>В фикстуре есть вся история оплат выбранных заказов на момент версии. Можно повторить утверждённое правило.</p></div>')+'<div class="run-list">'+(state.runs.length?state.runs.map(r=>'<div class="run"><div><strong>Проверка № '+r.n+'</strong><p style="margin:4px 0">'+r.message+'</p><span>'+names[r.source]+' · правило v1</span></div><span class="badge '+(r.ok?'green':'amber')+'">'+(r.ok?'Выполнена':'Неполный источник')+'</span></div>').join(''):'<div class="empty">После утверждения правила здесь появится первая проверка.</div>')+'</div></section></div><section class="panel"><div class="panel-head"><div><h2>Записи выбранной версии</h2><p class="small-text muted">'+names[state.source]+' · '+payments(state.source).length+' записей</p></div><span class="badge">Синтетический источник</span></div><div class="table-scroll"><table><thead><tr><th>Платёж</th><th>Заказ</th><th>Дата</th><th class="money">Сумма</th><th>Участие</th></tr></thead><tbody>'+payments(state.source).map(p=>'<tr><td class="mono">'+p.id+'</td><td>'+esc(p.order||'Пустое значение')+'</td><td>'+fmtDate(p.date)+'</td><td class="money">'+money(p.amount)+'</td><td><span class="badge '+(p.order?'green':'amber')+'">'+(p.order?'Связан с заказом':'Исключён: нет ключа')+'</span></td></tr>').join('')+'</tbody></table></div></section>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const p=people[state.role];document.getElementById('person').innerHTML='<span class="avatar">'+p[2]+'</span><div><strong>'+p[0]+'</strong><span class="muted">'+p[1]+'</span></div>';document.getElementById('main').innerHTML=state.page==='rule'?renderRule():state.page==='cases'?renderCases():renderSources();document.title=(state.page==='rule'?'Правило':state.page==='cases'?'Случаи':'Источники')+' · Сверка'}
document.addEventListener('input',e=>{if(e.target.id==='claim'&&state.selected)state.cases[state.selected].draft=e.target.value});
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;state.filter='all';if(state.role==='assignee'&&state.page==='rule')state.page='cases';render();notify('Режим просмотра: '+people[state.role][1]+'. Это симуляция ролей.')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='reset'){initial();notify('Демонстрация начата заново.')}if(a==='nav'){state.page=b.dataset.page;render()}if(a==='approve'&&can('analyst')){state.approved=true;run()}if(a==='run')run();if(a==='select'){state.selected=b.dataset.id;render();if(window.innerWidth<700)document.querySelector('.case-detail')?.scrollIntoView({behavior:'smooth',block:'start'})}if(a==='filter'){state.filter=b.dataset.filter;render()}if(a==='assign'&&can('coordinator')){const c=state.cases[state.selected];c.assignee=document.getElementById('assignee').value;c.work='assigned';c.draft=c.id==='З-102'?'Доплата 25 000 ₽ проведена 3 октября. Платёж П-102-2. Прошу проверить по новой выгрузке.':'';record(c,'Координатор назначил: '+c.assignee+'.');render();notify('Случай назначен. Ответственный увидит его в своей очереди.')}if(a==='claim'&&can('assignee')){const c=state.cases[state.selected];if(c.assignee!=='Алина Белова')return;const text=document.getElementById('claim').value.trim();if(!text){notify('Добавьте объяснение действия или номер документа.');document.getElementById('claim').focus();return}c.work='claimed';c.claimText=text;record(c,'Алина сообщила об исправлении: '+text);render();notify('Заявление сохранено. Последняя проверка пока подтверждает расхождение.')}if(a==='source'&&can('steward')){if(b.dataset.version==='base'&&state.lastGood==='full')return;state.source=b.dataset.version;render();notify('Демоверсия выбрана. Для нового вывода аналитик или координатор запускает проверку.')}if(a==='close'&&can('coordinator')){const c=state.cases[state.selected];if(c.current.delta!==0||c.unverified)return;c.work='closed';record(c,'Координатор завершил случай после подтверждения новой проверкой.');render();notify('Случай завершён. Его история и повторные наблюдения сохранены.')}if(a==='draft-rule'&&can('analyst')){state.draftRule=true;render();notify('Создан черновик v2. Действующее правило и его случаи не изменены.')}if(a==='discard-rule'){state.draftRule=false;render()}if(a==='explain'&&can('assignee')){
const c=state.cases[state.selected];
if(c.assignee!=='Алина Белова')return;
const explanation=document.getElementById('claim').value.trim();
if(!explanation){notify('Укажите объяснение отличия и его основание.');document.getElementById('claim').focus();return}
c.work='explained';c.explanation=explanation;
record(c,'Алина объяснила отличие: '+explanation);
render();notify('Объяснение передано координатору. Сумма расхождения не менялась.');
}
if(a==='accept-explanation'&&can('coordinator')){
const c=state.cases[state.selected];
const decision=document.getElementById('decision').value.trim();
const reviewAt=document.getElementById('reviewAt').value;
if(!decision){notify('Добавьте основание решения.');document.getElementById('decision').focus();return}
if(!reviewAt||reviewAt<='2026-10-03'){notify('Укажите дату следующего рассмотрения после 3 октября.');return}
const kind=document.getElementById('decisionKind').value;
c.work=kind==='data'?'accepted':'rule_review';c.decision=decision;c.reviewAt=reviewAt;
record(c,'Координатор: '+(kind==='data'?'данные верны, отличие разобрано':'требуется уточнение правила')+'. '+decision+' Следующее рассмотрение '+fmtDate(reviewAt)+'.');
render();notify('Решение сохранено. Математическая разница осталась прежней.');
}
if(a==='reopen'&&can('coordinator')){
const c=state.cases[state.selected];c.work='assigned';record(c,'Координатор вернул случай в работу.');render();
}
if(a==='review-rule'&&can('analyst')){
state.draftRule=true;state.page='rule';render();notify('Открыт черновик. Старое правило и наблюдения сохранены.');
}
});
window.reconciliationDemo={get state(){return state},orders,basePayments,correction,calculate};
initial();
</script>
