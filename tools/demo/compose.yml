name: razbor-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RAZBOR_DEMO_POSTGRES_PASSWORD:?Set RAZBOR_DEMO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

volumes:
  postgres_data:
